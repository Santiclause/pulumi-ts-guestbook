name: guestbook-easy
runtime: nodejs
description: Kubernetes Guestbook example based on https://kubernetes.io/docs/tutorials/stateless-application/guestbook/
template:
  config:
    namespace:
      description: Target K8s namespace
      default: default
    isMinikube:
      description: Whether you are deploying to minikube
      default: "true"
packages:
  service-monitor:
    source: kubernetes
    version: 4.34.2
    extensions:
      - name=service-monitor
      - crd-manifest=servicemonitor.yaml
